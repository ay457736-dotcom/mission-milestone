    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-card: rgba(20, 20, 30, 0.7);
            --neon-cyan: #00f5ff;
            --neon-cyan-dim: rgba(0, 245, 255, 0.3);
            --accent-purple: #8b5cf6;
            --frosted-glass: rgba(255, 255, 255, 0.03);
            --frosted-border: rgba(255, 255, 255, 0.1);
            --neon-cyan-glow: 0 0 20px rgba(0, 245, 255, 0.4);
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-geometric {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background: 
                linear-gradient(135deg, rgba(0, 245, 255, 0.03) 0%, transparent 50%),
                linear-gradient(225deg, rgba(139, 92, 246, 0.03) 0%, transparent 50%),
                var(--bg-dark);
        }

        .bg-geometric::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 245, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 245, 255, 0.05) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }

        h1, h2, h3 { font-family: 'Orbitron', sans-serif; }

        .glass-card {
            background: var(--frosted-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--frosted-border);
            border-radius: 20px;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--neon-cyan), var(--accent-purple));
            color: var(--bg-dark);
            box-shadow: var(--neon-cyan-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.6);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
        }

        .btn-secondary:hover {
            background: var(--neon-cyan);
            color: var(--bg-dark);
        }

        .text-neon { color: var(--neon-cyan); }
        .text-purple { color: var(--accent-purple); }
        .text-green { color: #00ff88; }
        .text-yellow { color: #fbbf24; }

        nav.fixed {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
        }

        .hero {
            padding: 150px 20px 80px;
            text-align: center;
        }

        .hero h1 {
            font-size: clamp(36px, 8vw, 72px);
            background: linear-gradient(135deg, var(--neon-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .hero .subtitle {
            font-size: 24px;
            color: var(--text-secondary);
            margin-bottom: 30px;
            letter-spacing: 3px;
        }

        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        section {
            padding: 80px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .section-subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 40px;
        }

        .store-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .store-card {
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .store-card:hover {
            transform: translateY(-8px);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.3);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .order-card {
            padding: 20px;
            margin-bottom: 15px;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .status-pending { background: rgba(251, 191, 36, 0.2); color: #fbbf24; }
        .status-awaiting { background: rgba(139, 92, 246, 0.2); color: #8b5cf6; }
        .status-verification { background: rgba(0, 245, 255, 0.2); color: #00f5ff; }
        .status-ready { background: rgba(0, 255, 136, 0.2); color: #00ff88; }
        .status-delivered { background: rgba(34, 197, 94, 0.2); color: #22c55e; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.show { display: flex; }

        .modal-content {
            background: rgba(20, 20, 30, 0.95);
            backdrop-filter: blur(30px);
            border: 1px solid var(--neon-cyan);
            border-radius: 25px;
            padding: 40px;
            max-width: 550px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 32px;
            cursor: pointer;
            color: var(--neon-cyan);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
        }
