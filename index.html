<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Delivery Marketplace</title>
    <!-- Tailwind CSS (Design ke liye) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
    </style>
</head>
<body class="p-5">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-center text-blue-400 mb-8">🛸 Drone Delivery Marketplace</h1>

        <!-- 🛒 SECTION 1: CUSTOMER ORDER FORM -->
        <div class="bg-slate-800 p-6 rounded-xl shadow-md mb-8 border border-slate-700">
            <h2 class="text-xl font-semibold mb-4 text-green-400">Place an Order (Customer Desk)</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm mb-1">Your Name:</label>
                    <input type="text" id="custName" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white" placeholder="Enter your name">
                </div>
                <div>
                    <label class="block text-sm mb-1">Select Drone Model:</label>
                    <select id="droneModel" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white">
                        <option value="QuadCopter Cargo X">QuadCopter Cargo X (₹500)</option>
                        <option value="HexaLifter Heavy">HexaLifter Heavy (₹1200)</option>
                        <option value="MicroSwift Delivery">MicroSwift Delivery (₹300)</option>
                    </select>
                </div>
                <button onclick="sendOrderToServer()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded transition">
                    Send Order Live 🚀
                </button>
            </div>
        </div>

        <!-- 🏪 SECTION 2: SHOPKEEPER DASHBOARD -->
        <div class="bg-slate-800 p-6 rounded-xl shadow-md border border-slate-700">
            <h2 class="text-xl font-semibold mb-4 text-amber-400">Live Orders Received (Shopkeeper Desk)</h2>
            <p class="text-sm text-slate-400 mb-3">👇 Yeh list har mobile me bina refresh kiye automatic update hogi:</p>
            
            <!-- Iske andar orders dikhenge -->
            <div id="liveOrdersContainer" class="space-y-3">
                <p class="text-slate-500 text-center py-4">Waiting for orders... (No orders yet)</p>
            </div>
        </div>
    </div>

    <!-- 🔥 FIREBASE REAL-TIME CONNECTION SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Aapki sahi wali configuration jo image me mili thi
        const firebaseConfig = {
            apiKey: "AIzaSyATzhq1HdHdPv4qWgWzUvs9wsohd8uFyq4",
            authDomain: "mission-milestone-1f55c.firebaseapp.com",
            databaseURL: "https://mission-milestone-1f55c-default-rtdb.firebaseio.com",
            projectId: "mission-milestone-1f55c",
            storageBucket: "mission-milestone-1f55c.appspot.com",
            messagingSenderId: "764940662411",
            appId: "1:764940662411:web:115ec9e815e7b09b9dc68e"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const ordersRef = ref(database, 'orders');

        // 🟢 FUNCTION: Jab button dabega toh data real database me jayega
        window.sendOrderToServer = function() {
            const nameInput = document.getElementById("custName").value;
            const droneInput = document.getElementById("droneModel").value;

            if(nameInput.trim() === "") {
                alert("Please enter your name first!");
                return;
            }

            // Database me push kar rahe hain
            push(ordersRef, {
                customerName: nameInput,
                droneModel: droneInput,
                time: new Date().toLocaleTimeString(),
                status: "Pending"
            }).then(() => {
                document.getElementById("custName").value = ""; // Input khali karne ke liye
            }).catch((err) => {
                alert("Database error: " + err.message);
            });
        }

        // 🔴 FUNCTION: Jo sabke phone me automatic bina refresh kiye data dikhayega
        onValue(ordersRef, (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById("liveOrdersContainer");
            
            if (data) {
                container.innerHTML = ""; // Purani list saaf karo
                
                // Ulti direction me dikhane ke liye taaki naya order sabse upar aaye
                Object.keys(data).reverse().forEach((key) => {
                    const order = data[key];
                    container.innerHTML += `
                        <div class="bg-slate-900 p-4 rounded-lg border-l-4 border-green-500 shadow">
                            <div class="flex justify-between items-center">
                                <span class="text-green-400 font-bold">👤 ${order.customerName}</span>
                                <span class="text-xs bg-slate-700 px-2 py-1 rounded text-slate-300">${order.time}</span>
                            </div>
                            <p class="text-sm text-slate-300 mt-1">🛸 Model: <span class="text-white font-medium">${order.droneModel}</span></p>
                            <span class="inline-block text-xs font-semibold text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded mt-2 border border-amber-500/20">
                                ⏳ ${order.status}
                            </span>
                        </div>
                    `;
                });
            } else {
                container.innerHTML = `<p class="text-slate-500 text-center py-4">Waiting for orders... (No orders yet)</p>`;
            }
        });
    </script>
</body>
</html>
